<meta name="claude:viewport-fit-sides" content="cover">
<title>Трекер привычек</title>
<style>
  :root {
    --bg: #f5f3ec; --card: #ffffff; --fg: #2a2620; --fg-dim: #8a8372;
    --accent: #c9712f; --line: #e8e2d4; --cell-off: #efeade;
    --font-ui: -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16140f; --card: #1f1c15; --fg: #efe9dc; --fg-dim: #9a9280;
      --accent: #e0923f; --line: #2e2a20; --cell-off: #272319; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16140f; --card: #1f1c15; --fg: #efe9dc; --fg-dim: #9a9280;
    --accent: #e0923f; --line: #2e2a20; --cell-off: #272319; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui);
    min-height: 100%; display: flex; align-items: center; justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px;
  }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
  h1 { font-size: 16px; font-weight: 700; margin: 0 0 18px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: center; padding: 6px 2px; }
  th.day { font-size: 11px; color: var(--fg-dim); font-weight: 600; }
  td.name { text-align: left; font-size: 13.5px; padding-right: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }

  .cell {
    width: 28px; height: 28px; border-radius: 7px; background: var(--cell-off); cursor: pointer;
    display: inline-block; transition: background 0.12s ease, transform 0.06s ease;
  }
  .cell:active { transform: scale(0.9); }
  .cell.on { background: var(--accent); }
  .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .add-row { display: flex; gap: 8px; margin-top: 18px; }
  .add-row input {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: transparent; color: var(--fg);
    border-radius: 9px; padding: 9px 11px; font-size: 13.5px; font-family: var(--font-ui);
  }
  .add-row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .add-row button {
    appearance: none; border: none; border-radius: 9px; background: var(--accent); color: #241a0c;
    font-weight: 700; padding: 0 16px; font-size: 14px; cursor: pointer; font-family: var(--font-ui);
  }
  .remove-habit {
    appearance: none; border: none; background: none; color: var(--fg-dim); font-size: 15px;
    cursor: pointer; padding: 0 4px; opacity: 0; transition: opacity 0.12s ease;
  }
  tr:hover .remove-habit, tr:focus-within .remove-habit { opacity: 1; }
</style>

<div class="card">
  <h1>Трекер привычек — эта неделя</h1>
  <table id="table"></table>
  <form class="add-row" id="addForm">
    <input type="text" id="addInput" placeholder="Новая привычка…" maxlength="40" autocomplete="off">
    <button type="submit">+</button>
  </form>
</div>

<script>
(function () {
  var STORAGE_KEY = 'habit-tracker-v1';
  var DAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  var defaults = [
    { name: 'Вода 2л', days: [true, true, false, true, false, false, false] },
    { name: 'Чтение', days: [true, false, true, true, true, false, false] },
    { name: 'Спорт', days: [false, true, false, false, true, false, false] }
  ];

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return defaults;
  }
  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(habits)); } catch (e) {} }

  var habits = load();
  var table = document.getElementById('table');

  function render() {
    var html = '<tr><th></th>';
    DAYS.forEach(function (d) { html += '<th class="day">' + d + '</th>'; });
    html += '<th></th></tr>';

    habits.forEach(function (h, hi) {
      html += '<tr><td class="name">' + h.name + '</td>';
      h.days.forEach(function (on, di) {
        html += '<td><span class="cell' + (on ? ' on' : '') + '" tabindex="0" role="button" data-h="' + hi + '" data-d="' + di + '"></span></td>';
      });
      html += '<td><button class="remove-habit" data-h="' + hi + '" aria-label="Удалить">×</button></td></tr>';
    });

    table.innerHTML = html;

    table.querySelectorAll('.cell').forEach(function (cell) {
      function toggle() {
        var h = parseInt(cell.dataset.h, 10), d = parseInt(cell.dataset.d, 10);
        habits[h].days[d] = !habits[h].days[d];
        save();
        render();
      }
      cell.addEventListener('click', toggle);
      cell.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    });
    table.querySelectorAll('.remove-habit').forEach(function (btn) {
      btn.addEventListener('click', function () {
        habits.splice(parseInt(btn.dataset.h, 10), 1);
        save();
        render();
      });
    });
  }

  document.getElementById('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('addInput');
    var name = input.value.trim();
    if (!name) return;
    habits.push({ name: name, days: new Array(7).fill(false) });
    input.value = '';
    save();
    render();
  });

  render();
})();
</script>
