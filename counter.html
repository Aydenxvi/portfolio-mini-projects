<meta name="claude:viewport-fit-sides" content="cover">
<title>Счётчик</title>
<style>
  /* Layout: one centered number, three plain buttons below it */
  :root {
    --bg: #fafafa;
    --fg: #1a1a1a;
    --fg-dim: #8a8a8a;
    --line: #e2e2e2;
    --accent: #2f5fe0;
    --danger: #c23b3b;
    --font-num: Georgia, 'Times New Roman', serif;
    --font-ui: -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212; --fg: #f0f0f0; --fg-dim: #8f8f8f; --line: #2a2a2a;
      --accent: #6e8ef5; --danger: #e4675f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212; --fg: #f0f0f0; --fg-dim: #8f8f8f; --line: #2a2a2a;
    --accent: #6e8ef5; --danger: #e4675f; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui);
    min-height: 100%; display: flex; align-items: center; justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px;
  }
  .wrap { width: 100%; max-width: 280px; text-align: center; }
  .label { font-size: 13px; color: var(--fg-dim); letter-spacing: 0.04em; margin-bottom: 6px; }
  .count { font-family: var(--font-num); font-size: 88px; line-height: 1; margin: 6px 0 28px; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 10px; }
  button {
    flex: 1; border: 1px solid var(--line); background: transparent; color: var(--fg);
    border-radius: 10px; padding: 14px 0; font-size: 22px; font-family: var(--font-ui);
    cursor: pointer; transition: background 0.1s ease, transform 0.06s ease;
  }
  button:active { transform: scale(0.96); }
  button.inc { border-color: var(--accent); color: var(--accent); }
  button.inc:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  button.dec:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  button.reset { font-size: 13px; color: var(--fg-dim); border: none; margin-top: 14px; width: 100%; padding: 6px; }
  button.reset:hover { color: var(--danger); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>

<div class="wrap">
  <div class="label">СЧЁТЧИК</div>
  <div class="count" id="count">0</div>
  <div class="row">
    <button class="dec" id="dec" aria-label="Уменьшить">−</button>
    <button class="inc" id="inc" aria-label="Увеличить">+</button>
  </div>
  <button class="reset" id="reset">Сбросить</button>
</div>

<script>
(function () {
  var n = 0;
  var el = document.getElementById('count');
  function render() { el.textContent = n; }
  document.getElementById('inc').addEventListener('click', function () { n++; render(); });
  document.getElementById('dec').addEventListener('click', function () { n--; render(); });
  document.getElementById('reset').addEventListener('click', function () { n = 0; render(); });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp' || e.key === '+') { n++; render(); }
    else if (e.key === 'ArrowDown' || e.key === '-') { n--; render(); }
    else if (e.key === '0') { n = 0; render(); }
  });
})();
</script>
