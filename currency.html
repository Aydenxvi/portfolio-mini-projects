<meta name="claude:viewport-fit-sides" content="cover">
<title>Конвертер валют</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --fg: #1b2030; --fg-dim: #767d93;
    --accent: #3657d6; --line: #e2e6f2;
    --font-ui: -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1016; --card: #171a24; --fg: #e8eaf3; --fg-dim: #8b90a6;
      --accent: #7c93f0; --line: #272b3a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1016; --card: #171a24; --fg: #e8eaf3; --fg-dim: #8b90a6;
    --accent: #7c93f0; --line: #272b3a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui);
    min-height: 100%; display: flex; align-items: center; justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px;
  }
  .card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  h1 { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  .note { font-size: 12px; color: var(--fg-dim); margin-bottom: 20px; line-height: 1.4; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; color: var(--fg-dim); margin-bottom: 4px; }
  .pair-row { display: flex; gap: 8px; }
  .pair-row input[type="number"] {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: transparent; color: var(--fg);
    border-radius: 10px; padding: 11px 12px; font-size: 17px; font-family: var(--font-ui);
    font-variant-numeric: tabular-nums;
  }
  select {
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
    border-radius: 10px; padding: 11px 10px; font-size: 14px; font-family: var(--font-ui);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .swap-row { display: flex; justify-content: center; margin: 2px 0 14px; }
  .swap {
    appearance: none; border: 1px solid var(--line); background: transparent; color: var(--fg-dim);
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .swap:hover { color: var(--accent); border-color: var(--accent); }
  .swap:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .rate-line { font-size: 12px; color: var(--fg-dim); text-align: center; margin-top: 4px; font-variant-numeric: tabular-nums; }
</style>

<div class="card">
  <h1>Конвертер валют</h1>
  <div class="note">Курсы — фиксированный демонстрационный снимок (не актуальные биржевые данные), для примера интерфейса.</div>

  <div class="field">
    <label for="amountFrom">Из</label>
    <div class="pair-row">
      <input type="number" id="amountFrom" value="100" inputmode="decimal">
      <select id="curFrom"></select>
    </div>
  </div>

  <div class="swap-row">
    <button class="swap" id="swap" aria-label="Поменять местами">⇅</button>
  </div>

  <div class="field">
    <label for="amountTo">В</label>
    <div class="pair-row">
      <input type="number" id="amountTo" inputmode="decimal">
      <select id="curTo"></select>
    </div>
  </div>

  <div class="rate-line" id="rateLine"></div>
</div>

<script>
(function () {
  // Illustrative snapshot rates relative to USD — demo data only.
  var rates = {
    USD: 1,
    EUR: 0.92,
    RUB: 83.4,
    TRY: 34.8,
    GBP: 0.79,
    KZT: 497,
    CNY: 7.1
  };
  var names = {
    USD: 'USD — доллар США', EUR: 'EUR — евро', RUB: 'RUB — рубль',
    TRY: 'TRY — лира', GBP: 'GBP — фунт', KZT: 'KZT — тенге', CNY: 'CNY — юань'
  };

  var amountFrom = document.getElementById('amountFrom');
  var amountTo = document.getElementById('amountTo');
  var curFrom = document.getElementById('curFrom');
  var curTo = document.getElementById('curTo');
  var swapBtn = document.getElementById('swap');
  var rateLine = document.getElementById('rateLine');

  function fillSelect(el, selected) {
    Object.keys(rates).forEach(function (code) {
      var opt = document.createElement('option');
      opt.value = code;
      opt.textContent = names[code];
      if (code === selected) opt.selected = true;
      el.appendChild(opt);
    });
  }
  fillSelect(curFrom, 'USD');
  fillSelect(curTo, 'EUR');

  function convert(fromEl, toEl, fromCur, toCur) {
    var val = parseFloat(fromEl.value);
    if (isNaN(val)) { toEl.value = ''; return; }
    var usd = val / rates[fromCur.value];
    var result = usd * rates[toCur.value];
    toEl.value = Math.round(result * 100) / 100;
  }

  function updateRateLine() {
    var r = rates[curTo.value] / rates[curFrom.value];
    rateLine.textContent = '1 ' + curFrom.value + ' ≈ ' + (Math.round(r * 10000) / 10000) + ' ' + curTo.value;
  }

  function forward() { convert(amountFrom, amountTo, curFrom, curTo); updateRateLine(); }
  function backward() { convert(amountTo, amountFrom, curTo, curFrom); updateRateLine(); }

  amountFrom.addEventListener('input', forward);
  amountTo.addEventListener('input', backward);
  curFrom.addEventListener('change', forward);
  curTo.addEventListener('change', forward);

  swapBtn.addEventListener('click', function () {
    var tmp = curFrom.value;
    curFrom.value = curTo.value;
    curTo.value = tmp;
    forward();
  });

  forward();
})();
</script>
