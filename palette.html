<meta name="claude:viewport-fit-sides" content="cover">
<title>Генератор палитр</title>
<style>
  :root {
    --bg: #f0eee8; --fg: #1d1c18; --fg-dim: #827f72; --line: #dedad0; --card: #ffffff;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    --font-ui: -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121210; --fg: #ece9e1; --fg-dim: #96927f; --line: #2a2822; --card: #1b1a16; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121210; --fg: #ece9e1; --fg-dim: #96927f; --line: #2a2822; --card: #1b1a16; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui);
    min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px;
  }
  .wrap { width: 100%; max-width: 760px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .top h1 { font-size: 15px; font-weight: 700; margin: 0; }
  .top .hint { font-size: 12px; color: var(--fg-dim); }

  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
  @media (max-width: 560px) { .row { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); } }

  .swatch {
    aspect-ratio: 3 / 4; border-radius: 14px; border: 1px solid var(--line);
    display: flex; flex-direction: column; justify-content: flex-end; padding: 10px;
    cursor: pointer; position: relative; overflow: hidden;
  }
  .swatch .hex {
    font-family: var(--font-mono); font-size: 12.5px; font-weight: 600;
    background: rgba(0,0,0,0.0); padding: 3px 6px; border-radius: 6px; align-self: flex-start;
  }
  .swatch .copied {
    position: absolute; top: 8px; right: 8px; font-size: 11px; font-family: var(--font-ui);
    opacity: 0; transition: opacity 0.15s ease;
  }
  .swatch.show-copied .copied { opacity: 1; }

  .lock {
    position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 50%;
    background: rgba(255,255,255,0.25); border: none; cursor: pointer; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }

  .actions { display: flex; gap: 10px; justify-content: center; }
  button.gen {
    appearance: none; border: none; border-radius: 10px; background: var(--fg); color: var(--bg);
    font-weight: 600; padding: 11px 22px; font-size: 14px; cursor: pointer; font-family: var(--font-ui);
  }
  button.gen:focus-visible { outline: 2px solid var(--fg-dim); outline-offset: 2px; }
  .sub-hint { text-align: center; font-size: 12px; color: var(--fg-dim); margin-top: 10px; }

  @media (prefers-reduced-motion: reduce) { .swatch .copied { transition: none; } }
</style>

<div class="wrap">
  <div class="top">
    <h1>Генератор палитр</h1>
    <span class="hint">клик по цвету — скопировать HEX</span>
  </div>
  <div class="row" id="row"></div>
  <div class="actions"><button class="gen" id="genBtn">Сгенерировать (пробел)</button></div>
  <div class="sub-hint">Замочек закрепляет цвет перед следующей генерацией</div>
</div>

<script>
(function () {
  var row = document.getElementById('row');
  var genBtn = document.getElementById('genBtn');
  var N = 5;
  var colors = [];
  var locked = new Array(N).fill(false);

  function randHex() {
    var h = Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0');
    return '#' + h;
  }

  function luminance(hex) {
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return (0.299*r + 0.587*g + 0.114*b) / 255;
  }

  function generate() {
    for (var i = 0; i < N; i++) {
      if (!locked[i] || !colors[i]) colors[i] = randHex();
    }
    render();
  }

  function render() {
    row.innerHTML = '';
    colors.forEach(function (hex, i) {
      var dark = luminance(hex) < 0.5;
      var div = document.createElement('div');
      div.className = 'swatch';
      div.style.background = hex;
      div.style.color = dark ? '#fff' : '#1a1a1a';
      div.innerHTML =
        '<button class="lock" data-i="' + i + '" style="color:' + (dark ? '#fff' : '#1a1a1a') + '">' + (locked[i] ? '\u{1F512}' : '\u{1F513}') + '</button>' +
        '<span class="copied">✓ скопировано</span>' +
        '<span class="hex">' + hex.toUpperCase() + '</span>';
      div.addEventListener('click', function (e) {
        if (e.target.closest('.lock')) return;
        var text = hex.toUpperCase();
        function flash() {
          div.classList.add('show-copied');
          setTimeout(function () { div.classList.remove('show-copied'); }, 900);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(flash, flash);
        } else { flash(); }
      });
      row.appendChild(div);
    });
    row.querySelectorAll('.lock').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var i = parseInt(btn.dataset.i, 10);
        locked[i] = !locked[i];
        render();
      });
    });
  }

  genBtn.addEventListener('click', generate);
  window.addEventListener('keydown', function (e) {
    if (e.key === ' ') { e.preventDefault(); generate(); }
  });

  generate();
})();
</script>
