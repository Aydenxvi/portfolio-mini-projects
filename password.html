<meta name="claude:viewport-fit-sides" content="cover">
<title>Генератор паролей</title>
<style>
  :root {
    --bg: #15161c; --card: #1d1f27; --fg: #eceef4; --fg-dim: #898ea3;
    --accent: #7c8cff; --line: #2b2e3a; --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    --font-ui: -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui);
    min-height: 100%; display: flex; align-items: center; justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px;
  }
  .card {
    width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 24px;
  }
  h1 { font-size: 16px; font-weight: 700; margin: 0 0 16px; }

  .output {
    display: flex; align-items: center; gap: 8px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px;
    margin-bottom: 18px;
  }
  #pw {
    flex: 1; min-width: 0; font-family: var(--mono); font-size: 17px; letter-spacing: 0.02em;
    overflow-x: auto; white-space: nowrap;
  }
  #pw::-webkit-scrollbar { display: none; }
  .copy {
    appearance: none; border: 1px solid var(--line); background: transparent; color: var(--fg-dim);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; font-family: var(--font-ui); cursor: pointer;
    white-space: nowrap;
  }
  .copy:hover { color: var(--fg); border-color: var(--accent); }
  .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .row label { font-size: 13px; color: var(--fg-dim); }
  .len-val { font-family: var(--mono); font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 8px 0 18px; }

  .opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .opt { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .opt input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }

  button.gen {
    width: 100%; appearance: none; border: none; border-radius: 10px;
    background: var(--accent); color: #14151c; font-size: 15px; font-weight: 600;
    padding: 12px 0; cursor: pointer; font-family: var(--font-ui);
    transition: filter 0.1s ease, transform 0.06s ease;
  }
  button.gen:hover { filter: brightness(1.08); }
  button.gen:active { transform: scale(0.98); }
  button.gen:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { button.gen { transition: none; } }
</style>

<div class="card">
  <h1>Генератор паролей</h1>

  <div class="output">
    <div id="pw">—</div>
    <button class="copy" id="copyBtn">Копировать</button>
  </div>

  <div class="row"><label for="len">Длина</label><span class="len-val" id="lenVal">16</span></div>
  <input type="range" id="len" min="6" max="32" value="16">

  <div class="opts">
    <label class="opt"><input type="checkbox" id="lower" checked> строчные (a-z)</label>
    <label class="opt"><input type="checkbox" id="upper" checked> заглавные (A-Z)</label>
    <label class="opt"><input type="checkbox" id="digits" checked> цифры (0-9)</label>
    <label class="opt"><input type="checkbox" id="symbols"> символы (!@#$)</label>
  </div>

  <button class="gen" id="genBtn">Сгенерировать</button>
</div>

<script>
(function () {
  var sets = {
    lower: 'abcdefghijklmnopqrstuvwxyz',
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    digits: '0123456789',
    symbols: '!@#$%^&*()-_=+?'
  };

  var pwEl = document.getElementById('pw');
  var lenInput = document.getElementById('len');
  var lenVal = document.getElementById('lenVal');
  var copyBtn = document.getElementById('copyBtn');
  var genBtn = document.getElementById('genBtn');
  var checks = {
    lower: document.getElementById('lower'),
    upper: document.getElementById('upper'),
    digits: document.getElementById('digits'),
    symbols: document.getElementById('symbols')
  };

  function randomChar(pool) {
    var arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return pool[arr[0] % pool.length];
  }

  function generate() {
    var pool = '';
    Object.keys(checks).forEach(function (k) {
      if (checks[k].checked) pool += sets[k];
    });
    if (!pool) { pwEl.textContent = 'Выберите хотя бы один набор'; return; }
    var len = parseInt(lenInput.value, 10);
    var out = '';
    for (var i = 0; i < len; i++) out += randomChar(pool);
    pwEl.textContent = out;
  }

  lenInput.addEventListener('input', function () {
    lenVal.textContent = lenInput.value;
    generate();
  });
  Object.keys(checks).forEach(function (k) {
    checks[k].addEventListener('change', generate);
  });
  genBtn.addEventListener('click', generate);

  copyBtn.addEventListener('click', function () {
    var text = pwEl.textContent;
    var original = copyBtn.textContent;
    function done(ok) {
      copyBtn.textContent = ok ? 'Скопировано' : 'Не вышло';
      setTimeout(function () { copyBtn.textContent = original; }, 1200);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else {
      done(false);
    }
  });

  generate();
})();
</script>
