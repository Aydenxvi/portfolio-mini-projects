<meta name="claude:viewport-fit-sides" content="cover">
<title>Markdown-превью</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --fg: #1e1e1c; --fg-dim: #86857c;
    --accent: #7a5cd6; --line: #e4e3dc; --code-bg: #f0eff5;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    --font-ui: -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212; --panel: #1a1a1a; --fg: #ececec; --fg-dim: #8f8f8a;
      --accent: #a894f0; --line: #2a2a28; --code-bg: #21212b; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212; --panel: #1a1a1a; --fg: #ececec; --fg-dim: #8f8f8a;
    --accent: #a894f0; --line: #2a2a28; --code-bg: #21212b; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui);
    min-height: 100%;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    display: flex; flex-direction: column; align-items: center;
  }
  .topbar { width: 100%; max-width: 920px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .topbar h1 { font-size: 15px; font-weight: 700; margin: 0; }
  .topbar .hint { font-size: 12px; color: var(--fg-dim); }

  .panes {
    width: 100%; max-width: 920px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    flex: 1; min-height: 0;
  }
  @media (max-width: 640px) { .panes { grid-template-columns: 1fr; } }

  .pane {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  }
  .pane-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--fg-dim); padding: 10px 14px; border-bottom: 1px solid var(--line);
  }
  textarea {
    flex: 1; border: none; resize: none; background: transparent; color: var(--fg);
    font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6; padding: 14px;
    min-height: 320px;
  }
  textarea:focus { outline: none; }

  .preview { flex: 1; overflow-y: auto; padding: 16px 18px; font-size: 14.5px; line-height: 1.65; min-height: 320px; }
  .preview h1, .preview h2, .preview h3 { line-height: 1.25; margin: 0.6em 0 0.35em; text-wrap: balance; }
  .preview h1 { font-size: 1.6em; }
  .preview h2 { font-size: 1.3em; }
  .preview h3 { font-size: 1.1em; }
  .preview p { margin: 0.5em 0; }
  .preview code { font-family: var(--font-mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
  .preview pre { background: var(--code-bg); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
  .preview pre code { background: none; padding: 0; }
  .preview blockquote { border-left: 3px solid var(--accent); margin: 0.6em 0; padding: 2px 0 2px 12px; color: var(--fg-dim); }
  .preview ul { padding-left: 1.3em; margin: 0.5em 0; }
  .preview a { color: var(--accent); }
  .preview strong { font-weight: 700; }
</style>

<div class="topbar">
  <h1>Markdown-превью</h1>
  <div class="hint">заголовки, **жирный**, *курсив*, списки, ссылки, код</div>
</div>

<div class="panes">
  <div class="pane">
    <div class="pane-label">Markdown</div>
    <textarea id="input" spellcheck="false"></textarea>
  </div>
  <div class="pane">
    <div class="pane-label">Результат</div>
    <div class="preview" id="preview"></div>
  </div>
</div>

<script>
(function () {
  var input = document.getElementById('input');
  var preview = document.getElementById('preview');

  var sample = [
    '# Заголовок проекта',
    '',
    'Короткое описание того, чем занимается **этот инструмент** — превью',
    'markdown в реальном времени, без сторонних библиотек.',
    '',
    '## Возможности',
    '',
    '- заголовки `#`, `##`, `###`',
    '- *курсив* и **жирный** текст',
    '- ссылки: [сайт Anthropic](https://anthropic.com)',
    '- `инлайн-код` и блоки кода',
    '',
    '> Блок цитаты для заметок на полях',
    '',
    '```',
    'function hello() {',
    '  return "привет";',
    '}',
    '```'
  ].join('\n');

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function inline(text) {
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return text;
  }

  function render(md) {
    var escaped = escapeHtml(md);
    var lines = escaped.split('\n');
    var html = '';
    var inCode = false, codeBuf = [];
    var inList = false;
    var i = 0;

    function closeList() { if (inList) { html += '</ul>'; inList = false; } }

    for (i = 0; i < lines.length; i++) {
      var line = lines[i];

      if (line.trim().slice(0, 3) === '```') {
        if (!inCode) { inCode = true; codeBuf = []; }
        else { inCode = false; html += '<pre><code>' + codeBuf.join('\n') + '</code></pre>'; }
        continue;
      }
      if (inCode) { codeBuf.push(line); continue; }

      if (/^###\s+/.test(line)) { closeList(); html += '<h3>' + inline(line.replace(/^###\s+/, '')) + '</h3>'; continue; }
      if (/^##\s+/.test(line)) { closeList(); html += '<h2>' + inline(line.replace(/^##\s+/, '')) + '</h2>'; continue; }
      if (/^#\s+/.test(line)) { closeList(); html += '<h1>' + inline(line.replace(/^#\s+/, '')) + '</h1>'; continue; }

      if (/^&gt;\s?/.test(line)) { closeList(); html += '<blockquote>' + inline(line.replace(/^&gt;\s?/, '')) + '</blockquote>'; continue; }

      if (/^[-*]\s+/.test(line)) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + inline(line.replace(/^[-*]\s+/, '')) + '</li>';
        continue;
      }
      closeList();

      if (line.trim() === '') continue;
      html += '<p>' + inline(line) + '</p>';
    }
    closeList();
    if (inCode && codeBuf.length) html += '<pre><code>' + codeBuf.join('\n') + '</code></pre>';
    return html;
  }

  function update() { preview.innerHTML = render(input.value); }
  input.addEventListener('input', update);

  input.value = sample;
  update();
})();
</script>
